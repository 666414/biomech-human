# 弯腰提重物（2.0s，双手 -150N 载荷，主模型）。
# 所有角度 deg：L5_S1_FE / T12_L1_FE 负=前屈，pelvis_tilt 正=前倾，下肢关节 deg，激活度 0-1。
# 注意：本模型中 pelvis_tilt 与 hip_flexion 绕同一矢状轴同向叠加（大腿绝对俯仰=两者之和），
# 故 pelvis 前倾 51.6° 时 hip_flexion 取 -25° 补偿，保持大腿接近直立、双足接地（配合 sink_track）。
name: lift_task
xml: assets/MS-Human-700/MS-Human-700.xml
duration: 2.0
sim_stride: 10
ground:
  mode: auto
  target_grf: 1.0
# sink_track 校准值：维持弯腰全程双足接地，使 GRF_z ≈ 体重 + 双手载荷（准静态平衡）
sink_track: [[0, 0], [30, 0], [35, -0.005], [40, -0.0046], [45, 0.0011], [50, 0.0118], [55, 0.0274], [60, 0.0274], [65, 0.0275], [70, 0.0275], [75, 0.0141], [80, 0.0041], [85, -0.0025], [90, -0.0055], [95, -0.0047], [100, 0]]
external_forces:
  - body: hand_r
    track: [[0, 0, 0, 0], [30, 0, 0, 0], [55, 0, 0, -150], [70, 0, 0, -150], [95, 0, 0, 0], [100, 0, 0, 0]]
muscles: [glmax1_r, glmax2_r, bflh_r, semimem_r, addlong_r, gasmed_r]
pose_tracks:
  pelvis_tilt: [[0, 0], [30, 0], [55, 51.6], [70, 51.6], [100, 0]]  # deg
  hip_flexion_r: [[0, 5], [30, 5], [55, -25], [70, -25], [100, 5]]  # 补偿 pelvis_tilt 前倾
  hip_flexion_l: [[0, 5], [30, 5], [55, -25], [70, -25], [100, 5]]
  knee_angle_r: [[0, 10], [30, 10], [55, 25], [70, 25], [100, 10]]
  knee_angle_l: [[0, 10], [30, 10], [55, 25], [70, 25], [100, 10]]
  L5_S1_FE: [[0, 0], [30, 0], [55, -25.8], [70, -25.8], [100, 0]]  # deg，负=前屈
  T12_L1_FE: [[0, 0], [30, 0], [55, -20.1], [70, -20.1], [100, 0]]  # deg，负=前屈
muscle_tracks:
  glmax1_r: [[0, 0.10], [30, 0.15], [55, 0.70], [70, 0.75], [90, 0.30], [100, 0.10]]
  glmax2_r: [[0, 0.10], [30, 0.15], [55, 0.65], [70, 0.70], [90, 0.30], [100, 0.10]]
  bflh_r: [[0, 0.10], [30, 0.10], [55, 0.50], [70, 0.55], [90, 0.25], [100, 0.10]]
  semimem_r: [[0, 0.08], [30, 0.10], [55, 0.45], [70, 0.50], [90, 0.20], [100, 0.08]]
  addlong_r: [[0, 0.10], [30, 0.10], [55, 0.35], [70, 0.35], [90, 0.15], [100, 0.10]]
  gasmed_r: [[0, 0.10], [30, 0.10], [55, 0.30], [70, 0.30], [90, 0.15], [100, 0.10]]
keyframes:
  - {t: 0.8, label: 弯腰抓握（L5-S1 高压缩/剪切负荷）, cardId: lift_bent}
  - {t: 1.3, label: 起身提举（伸髋肌群主导发力）, cardId: lift_up}
